services:
  # 1. خدمة الـ Backend API (ASP.NET Core 8)
  - type: web
    name: pharmacy-backend-api
    runtime: docker
    dockerfilePath: ./src/backend_csharp/Dockerfile
    dockerContext: ./src/backend_csharp
    plan: free
    region: frankfurt # أو oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-cloud-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: AllowedHosts
        value: "*"

databases:
  # 2. قاعدة بيانات PostgreSQL السحابية المدارة
  - name: pharmacy-cloud-db
    plan: free
    region: frankfurt
    databaseName: pharmacy_prod_db
    user: pharmacy_admin
